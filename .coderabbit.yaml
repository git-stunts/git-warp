# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit must not apply labels. People set the issue label axes in
# AGENTS.md, people and release gates query them, and AGENTS.md requires
# exactly one label per axis. CodeRabbit added second labels on axes and
# labels outside the axes, and it re-added labels that people had removed.
#
# `inheritance: true` keeps every other setting from the organization and
# repository UI configuration; this file overrides only the keys below.
# Keys: docs.coderabbit.ai/reference/configuration (reviews.auto_apply_labels,
# reviews.suggested_labels, issue_enrichment.labeling.auto_apply_labels) and
# docs.coderabbit.ai/configuration/configuration-inheritance.
#
# Not overridden: reviews.slop_detection. Its `label` key has no default in
# schema.v2.json, so it labels a PR classified as slop only when an
# inherited setting names a label. Turning it off would also turn off its
# spam detection; that is a maintainer decision.
inheritance: true
reviews:
  auto_apply_labels: false
  suggested_labels: false
issue_enrichment:
  labeling:
    auto_apply_labels: false
