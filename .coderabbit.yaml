# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit must not apply labels. The label axes (type:*, priority:*,
# status:*, area:*) are set by people and read by the planner; AGENTS.md
# requires exactly one label per axis. CodeRabbit also added template:* and
# domain:* labels, which are not axes.
#
# `inheritance: true` keeps every other setting from the organization and
# repository UI configuration; this file overrides only the keys below.
# Keys: docs.coderabbit.ai/reference/configuration (reviews.auto_apply_labels,
# reviews.suggested_labels, issue_enrichment.labeling.auto_apply_labels) and
# docs.coderabbit.ai/configuration/configuration-inheritance.
inheritance: true
reviews:
  auto_apply_labels: false
  suggested_labels: false
issue_enrichment:
  labeling:
    auto_apply_labels: false
