services:
  test:
    init: true
    build:
      # scripts/RunDockerTestContainer.sh points this at a tracked-files-only copy.
      context: ${GIT_WARP_DOCKER_CONTEXT:-..}
      dockerfile: docker/Dockerfile.node22-slim
    environment:
      - GIT_STUNTS_DOCKER=1

  benchmark:
    build:
      context: ..
      dockerfile: docker/Dockerfile.benchmark
    environment:
      - GIT_STUNTS_DOCKER=1
    command: ["node", "benchmarks/benchmark.js"]
