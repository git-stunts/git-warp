name: Performance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Base ref to compare
        required: true
        default: main^
        type: string
      head:
        description: Head ref to compare
        required: true
        default: main
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: v19 base/head performance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUNNER_ENVIRONMENT: github-actions-ubuntu-24.04
    steps:
      - name: Resolve exact comparison refs
        id: refs
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || inputs.base }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'push' && github.sha || inputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BASE_REF" || "$BASE_REF" =~ ^0+$ ]]; then
            echo "Performance comparison requires a concrete base ref"
            exit 1
          fi
          test -n "$HEAD_REF"
          echo "base=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Check out base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.refs.outputs.base }}
          path: base
          persist-credentials: false

      - name: Check out head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.refs.outputs.head }}
          path: head
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            base/package-lock.json
            head/package-lock.json
            head/fixtures/v18/retained-substrate-medium/package-lock.json

      - name: Run copied performance comparison
        env:
          ORDER_SEED: ${{ github.event.pull_request.number || github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          image="git-warp-performance:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="git-warp-performance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          created=0
          cleanup() {
            status=$?
            trap - EXIT
            if [[ "$created" == 1 ]]; then
              docker stop --time 10 "$container" >/dev/null || true
              docker cp "$container:/comparison/performance-results" performance-results || {
                echo "Failed to export performance evidence" >&2
                if [[ "$status" == 0 ]]; then status=1; fi
              }
              docker rm "$container" >/dev/null || {
                echo "Failed to remove performance container" >&2
                if [[ "$status" == 0 ]]; then status=1; fi
              }
            fi
            if [[ -f performance-results/summary.md ]]; then
              cat performance-results/summary.md >> "$GITHUB_STEP_SUMMARY"
            fi
            if [[ -f performance-results/migrated-read/summary.md ]]; then
              cat performance-results/migrated-read/summary.md >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          docker build --file head/docker/Dockerfile.performance-comparison --tag "$image" .
          docker create --interactive --init --name "$container" \
            --env RUNNER_ENVIRONMENT --env ORDER_SEED "$image" bash -s >/dev/null
          created=1
          attach_status=0
          docker start --attach --interactive "$container" <<'MEASUREMENT' || attach_status=$?
          set -euo pipefail
          npm --prefix base run build:maintainer --silent
          npm --prefix head run build:maintainer --silent
          node head/dist/scripts/performance/RunPerformanceComparison.js \
            --base-directory base \
            --head-directory head \
            --output-directory performance-results \
            --order-seed "$ORDER_SEED"
          gate_status=0
          node head/dist/scripts/performance/GatePerformance.js \
            --comparison performance-results/comparison.json \
            --policy head/benchmarks/v19/policy.json \
            --summary performance-results/summary.md || gate_status=$?
          migrated_status=0
          GIT_WARP_MIGRATED_READ_RUNS=5 GIT_WARP_MIGRATED_READ_WARMUPS=1 \
            node head/dist/scripts/v18-to-v19/performance/RunMigratedReadPerformance.js \
            --output performance-results/migrated-read/report.json \
            --policy head/benchmarks/v19/migrated-read-policy.json \
            --manifest head/fixtures/v18/retained-substrate-medium/manifest.json \
            --fixture-package head/fixtures/v18/retained-substrate-medium \
            || migrated_status=$?
          if [[ "$gate_status" != 0 ]]; then exit "$gate_status"; fi
          exit "$migrated_status"
          MEASUREMENT
          command_status=$(docker inspect --format '{{.State.ExitCode}}' "$container")
          if [[ ! "$command_status" =~ ^[0-9]+$ ]]; then
            echo "Docker returned an invalid performance exit status" >&2
            exit 1
          fi
          if [[ "$command_status" != 0 ]]; then exit "$command_status"; fi
          exit "$attach_status"

      - name: Retain raw samples and environment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v19-performance-${{ github.sha }}
          path: performance-results
          if-no-files-found: warn
          retention-days: 90
