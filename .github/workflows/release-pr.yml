name: Release Preflight (PR)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: release-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Setup Deno 2.6.7
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 'v2.6.7'

      - name: Install
        run: npm ci

      - name: Compute predicted dist-tag from package version
        id: predict
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DIST=latest
          PRE=false
          if [[ "$VERSION" =~ -(rc|beta|alpha)\. ]]; then
            PRE=true
            if [[ "$VERSION" =~ -rc\. ]]; then DIST=next; fi
            if [[ "$VERSION" =~ -beta\. ]]; then DIST=beta; fi
            if [[ "$VERSION" =~ -alpha\. ]]; then DIST=alpha; fi
          fi
          {
            echo "version=$VERSION"
            echo "dist=$DIST"
            echo "pre=$PRE"
          } >> "$GITHUB_OUTPUT"

      - name: Lint
        run: npm run lint --if-present

      - name: TypeScript
        run: npm run typecheck:src

      - name: TS policy
        run: npm run typecheck:policy

      - name: Build
        id: build
        run: npm run build --silent

      - name: Analyze actual npm bundle
        id: bundle
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/bundle" --json > "$RUNNER_TEMP/bundle/inventory.json"
          tar -xzf "$RUNNER_TEMP"/bundle/*.tgz -C "$RUNNER_TEMP/bundle"
          node scripts/package-payload/ReportPackagePayload.ts \
            "$RUNNER_TEMP/bundle/package" "$RUNNER_TEMP/bundle/inventory.json" \
            "$RUNNER_TEMP/bundle/report.md" "$RUNNER_TEMP/bundle/findings.txt"
          cat "$RUNNER_TEMP/bundle/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        run: npm run test:local --if-present

      - name: npm package payload
        id: payload
        run: npm run check:package-payload

      - name: JSR dry-run
        id: jsr
        run: npm run jsr:publish -- --dry-run

      - name: Release prep guard
        run: npm run release:guard -- --stage prep-pr --tag "v${{ steps.predict.outputs.version }}"

      - name: Upload bundle evidence
        if: ${{ always() && steps.bundle.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-bundle-analysis
          path: ${{ runner.temp }}/bundle/*.*
          retention-days: 14

      - name: PR comment (release preview)
        if: ${{ always() && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RELEASE_DIST: ${{ steps.predict.outputs.dist }}
          RELEASE_PRE: ${{ steps.predict.outputs.pre }}
          RELEASE_VERSION: ${{ steps.predict.outputs.version }}
          PREFLIGHT_STATUS: ${{ job.status }}
          PAYLOAD_STATUS: ${{ steps.payload.outcome }}
          JSR_STATUS: ${{ steps.jsr.outcome }}
          BUNDLE_STATUS: ${{ steps.bundle.outcome }}
          BUNDLE_REPORT: ${{ runner.temp }}/bundle/report.md
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- git-warp-release-preflight -->';
            const version = process.env.RELEASE_VERSION || 'unavailable';
            const reportPath = process.env.BUNDLE_REPORT;
            const report = process.env.BUNDLE_STATUS === 'success' && fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : '### npm bundle analysis\n\n⚠️ Analysis unavailable: inspect the failed or skipped build/analysis step.';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## Release Preflight',
              '',
              `Head: \`${process.env.PR_HEAD}\` · [Workflow and complete bundle evidence](${runUrl})`,
              '',
              `- package version: \`${version}\``,
              `- prerelease: \`${process.env.RELEASE_PRE || 'unavailable'}\``,
              `- npm dist-tag on release: \`${process.env.RELEASE_DIST || 'unavailable'}\``,
              `- preflight: **${process.env.PREFLIGHT_STATUS || 'unavailable'}**`,
              `- npm package payload: **${process.env.PAYLOAD_STATUS}**`,
              `- jsr publish dry-run: **${process.env.JSR_STATUS}**`,
              '',
              report,
              '',
              'A release-branch merge still requires final preflight and the normal release workflow.'
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number, per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
